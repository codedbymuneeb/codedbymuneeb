<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 370" width="1200" height="370" role="img" aria-labelledby="p4-t">
  <title id="p4-t">US Accidents Analysis: Comprehensive exploratory data analysis with 18+ graphs.</title>
  <defs>
    <linearGradient id="p4-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#190B12"/><stop offset="1" stop-color="#10070C"/>
    </linearGradient>
    <radialGradient id="p4-glow" cx="82%" cy="30%" r="55%">
      <stop offset="0" stop-color="#701A3D" stop-opacity=".7"/><stop offset="1" stop-color="#451126" stop-opacity="0"/>
    </radialGradient>
    <pattern id="p4-grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#C77B9B" stroke-opacity=".07"/>
    </pattern>
    <clipPath id="p4-clip"><rect width="1200" height="370" rx="18"/></clipPath>
    <linearGradient id="p4-trace" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8F0F3"/><stop offset=".45" stop-color="#E5B5C7"/><stop offset="1" stop-color="#C77B9B" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .p4-serif { font-family: Georgia, "Iowan Old Style", "Palatino Linotype", "Times New Roman", serif; }
    .p4-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .p4-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .p4-in { animation: p4-in 1.2s cubic-bezier(.16,1,.3,1) both; }
    .p4-d1 { animation-delay: .15s; } .p4-d2 { animation-delay: .4s; }
    .p4-chip { animation: p4-chip .7s cubic-bezier(.34,1.56,.64,1) both; }
    @keyframes p4-chip { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    .p4-draw { stroke-dasharray: 600; stroke-dashoffset: 600; animation: p4-draw 2s cubic-bezier(.65,0,.35,1) .5s forwards; }
    @keyframes p4-in { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
    @keyframes p4-draw { to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) { .p4-in, .p4-chip { animation: none; } .p4-draw { animation: none; stroke-dashoffset: 0; } }
    .p4-trace { stroke-dasharray: 564 3136; stroke-dashoffset: 3700; animation: p4-trace 7s linear infinite; }
    @keyframes p4-trace { to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) { .p4-trace { display: none; } }
  </style>
  <g clip-path="url(#p4-clip)">
    <rect width="1200" height="370" fill="url(#p4-bg)"/>
    <rect x="720" width="480" height="370" fill="url(#p4-grid)"/>
    <rect width="1200" height="370" fill="url(#p4-glow)"/>
    <rect class="p4-trace" x=".5" y=".5" width="1199" height="369" rx="17.5" fill="none" stroke="url(#p4-trace)" stroke-width="1.8"/>

    <g class="p4-in p4-d1">
      <text class="p4-mono" x="56" y="62" font-size="12" letter-spacing="2.6" fill="#C77B9B">04 &#183; DATA ANALYSIS &#183; EDA &#183; VISUALIZATION &#183; 2025</text>
      <text class="p4-serif" x="54" y="126" font-size="48" font-weight="300" letter-spacing="-1.5" fill="#F8F0F3">US Accidents Analysis</text>
      <text class="p4-sans" x="56" y="166" font-size="16.5" fill="#B6A3AC">Beginner-friendly, deep exploratory analysis uncovering insights across nationwide traffic incidents.</text>
      <text class="p4-mono" x="56" y="200" font-size="12.5" fill="#E5B5C7"><tspan fill="#C77B9B">STRUCTURE &#8594;</tspan> Chapter-by-chapter notebook with 18+ comprehensive statistical graphs</text>
      <line class="p4-draw" x1="56" y1="226" x2="680" y2="226" stroke="#C77B9B" stroke-opacity=".3"/>

      <g transform="translate(56 266)">
        <text class="p4-serif" font-size="34" font-weight="300" fill="#F8F0F3">18+</text>
        <text class="p4-sans" y="24" font-size="12.5" fill="#B6A3AC">custom statistical graphs</text>
      </g>
      <g transform="translate(250 266)">
        <text class="p4-serif" font-size="34" font-weight="300" fill="#F8F0F3">Cleaned</text>
        <text class="p4-sans" y="24" font-size="12.5" fill="#B6A3AC">missing-data pipelines</text>
      </g>
      <g transform="translate(460 266)">
        <text class="p4-serif" font-size="34" font-weight="300" fill="#F8F0F3">Chapter</text>
        <text class="p4-sans" y="24" font-size="12.5" fill="#B6A3AC">organized insights flow</text>
      </g>

      <g class="p4-chip" style="animation-delay:1.00s"><rect x="56" y="314" width="70" height="26" rx="13" fill="#27101C" stroke="#C77B9B" stroke-opacity=".35"/><text class="p4-mono" x="91" y="331" text-anchor="middle" font-size="11.5" fill="#E5B5C7">Python</text></g>
      <g class="p4-chip" style="animation-delay:1.12s"><rect x="134" y="314" width="75" height="26" rx="13" fill="#27101C" stroke="#C77B9B" stroke-opacity=".35"/><text class="p4-mono" x="171" y="331" text-anchor="middle" font-size="11.5" fill="#E5B5C7">Pandas</text></g>
      <g class="p4-chip" style="animation-delay:1.24s"><rect x="217" y="314" width="65" height="26" rx="13" fill="#27101C" stroke="#C77B9B" stroke-opacity=".35"/><text class="p4-mono" x="249" y="331" text-anchor="middle" font-size="11.5" fill="#E5B5C7">NumPy</text></g>
      <g class="p4-chip" style="animation-delay:1.36s"><rect x="290" y="314" width="85" height="26" rx="13" fill="#27101C" stroke="#C77B9B" stroke-opacity=".35"/><text class="p4-mono" x="332" y="331" text-anchor="middle" font-size="11.5" fill="#E5B5C7">Matplotlib</text></g>
      <g class="p4-chip" style="animation-delay:1.48s"><rect x="383" y="314" width="135" height="26" rx="13" fill="#27101C" stroke="#C77B9B" stroke-opacity=".35"/><text class="p4-mono" x="450" y="331" text-anchor="middle" font-size="11.5" fill="#E5B5C7">18 Graph Analysis</text></g>
    </g>

    <!-- Visual Graphic: Data Visualization Dashboard -->
    <g class="p4-in p4-d2" transform="translate(800 65)">
      <rect width="340" height="240" rx="14" fill="#140810" stroke="#C77B9B" stroke-opacity=".3"/>
      <path d="M0 14 a14 14 0 0 1 14 -14 H326 a14 14 0 0 1 14 14 V34 H0 Z" fill="#210D18"/>
      <circle cx="20" cy="17" r="4.5" fill="#701A3D"/><circle cx="35" cy="17" r="4.5" fill="#451126"/><circle cx="50" cy="17" r="4.5" fill="#451126"/>
      <text class="p4-mono" x="170" y="21" text-anchor="middle" font-size="10.5" letter-spacing="1.5" fill="#B6A3AC">EXPLORATORY DATA ENGINE</text>

      <!-- Multi-bar Chart & Trend Line -->
      <g transform="translate(30 50)">
        <rect width="280" height="165" rx="8" fill="#1C0A15" stroke="#701A3D" stroke-opacity=".4"/>
        
        <!-- Grid horizontal lines -->
        <line x1="20" y1="40" x2="260" y2="40" stroke="#C77B9B" stroke-opacity=".15"/>
        <line x1="20" y1="80" x2="260" y2="80" stroke="#C77B9B" stroke-opacity=".15"/>
        <line x1="20" y1="120" x2="260" y2="120" stroke="#C77B9B" stroke-opacity=".15"/>

        <!-- Animated trend line -->
        <path d="M25 110 C 60 90, 90 105, 120 70 S 180 35, 215 50 S 245 25, 255 20" fill="none" stroke="#E5B5C7" stroke-width="2.5" stroke-dasharray="300" stroke-dashoffset="300">
          <animate attributeName="stroke-dashoffset" values="300;0" dur="2.5s" fill="freeze"/>
        </path>

        <!-- Dynamic Bars -->
        <rect x="40" y="70" width="16" height="50" rx="3" fill="#701A3D"><animate attributeName="height" values="20;50;35;50" dur="2s" repeatCount="indefinite"/><animate attributeName="y" values="100;70;85;70" dur="2s" repeatCount="indefinite"/></rect>
        <rect x="75" y="55" width="16" height="65" rx="3" fill="#C77B9B"><animate attributeName="height" values="30;65;45;65" dur="2.2s" repeatCount="indefinite"/><animate attributeName="y" values="90;55;75;55" dur="2.2s" repeatCount="indefinite"/></rect>
        <rect x="110" y="40" width="16" height="80" rx="3" fill="#E5B5C7"><animate attributeName="height" values="40;80;55;80" dur="1.8s" repeatCount="indefinite"/><animate attributeName="y" values="80;40;65;40" dur="1.8s" repeatCount="indefinite"/></rect>
        <rect x="145" y="60" width="16" height="60" rx="3" fill="#701A3D"><animate attributeName="height" values="25;60;40;60" dur="2.4s" repeatCount="indefinite"/><animate attributeName="y" values="95;60;80;60" dur="2.4s" repeatCount="indefinite"/></rect>
        <rect x="180" y="30" width="16" height="90" rx="3" fill="#F8F0F3"><animate attributeName="height" values="45;90;60;90" dur="1.9s" repeatCount="indefinite"/><animate attributeName="y" values="75;30;60;30" dur="1.9s" repeatCount="indefinite"/></rect>
        <rect x="215" y="45" width="16" height="75" rx="3" fill="#C77B9B"><animate attributeName="height" values="35;75;50;75" dur="2.1s" repeatCount="indefinite"/><animate attributeName="y" values="85;45;70;45" dur="2.1s" repeatCount="indefinite"/></rect>

        <text class="p4-mono" x="20" y="148" font-size="9.5" fill="#E5B5C7">DISTRIBUTION: ACCIDENTS BY SEVERITY &amp; TIME</text>
      </g>
    </g>
  </g>
</svg>