<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="220" viewBox="0 0 1200 220">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#241019"/><stop offset="1" stop-color="#190B12"/></linearGradient>
  <linearGradient id="ac" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#701A3D"/><stop offset="1" stop-color="#C77B9B"/></linearGradient>
  <radialGradient id="gl"><stop offset="0" stop-color="#C77B9B" stop-opacity=".3"/><stop offset="1" stop-color="#C77B9B" stop-opacity="0"/></radialGradient>
</defs>
<rect width="1200" height="220" rx="18" fill="url(#bg)"/>
<circle cx="100" cy="200" r="130" fill="url(#gl)"><animate attributeName="r" values="130;170;130" dur="9s" repeatCount="indefinite"/></circle>

<rect x="60" y="28" width="180" height="28" rx="14" fill="#451126" stroke="#701A3D" stroke-width="1"/>
<text x="150" y="47" text-anchor="middle" font-family="'Segoe UI',sans-serif" font-size="12" letter-spacing="2" fill="#C77B9B">LLM · LANGCHAIN · NLP</text>

<text x="60" y="96" font-family="Georgia,'Times New Roman',serif" font-size="36" fill="#F8F0F3">LLM Chatbot</text>
<rect x="60" y="106" width="260" height="3" rx="1.5" fill="url(#ac)"/>

<text x="60" y="140" font-family="'Segoe UI',Arial,sans-serif" font-size="15" fill="#B6A3AC">A conversational chatbot built on large language models using LangChain.</text>
<text x="60" y="162" font-family="'Segoe UI',Arial,sans-serif" font-size="15" fill="#B6A3AC">Supports context-aware multi-turn dialogue and retrieval-augmented generation.</text>

<rect x="60" y="182" width="80" height="26" rx="13" fill="#451126" stroke="#701A3D"/>
<text x="100" y="200" text-anchor="middle" font-family="'Segoe UI',sans-serif" font-size="12" fill="#E5B5C7">Python</text>
<rect x="152" y="182" width="100" height="26" rx="13" fill="#451126" stroke="#701A3D"/>
<text x="202" y="200" text-anchor="middle" font-family="'Segoe UI',sans-serif" font-size="12" fill="#E5B5C7">LangChain</text>
<rect x="264" y="182" width="70" height="26" rx="13" fill="#451126" stroke="#701A3D"/>
<text x="299" y="200" text-anchor="middle" font-family="'Segoe UI',sans-serif" font-size="12" fill="#E5B5C7">LLMs</text>
<rect x="346" y="182" width="60" height="26" rx="13" fill="#451126" stroke="#701A3D"/>
<text x="376" y="200" text-anchor="middle" font-family="'Segoe UI',sans-serif" font-size="12" fill="#E5B5C7">NLP</text>
