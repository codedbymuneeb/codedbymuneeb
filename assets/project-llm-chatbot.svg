<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 370" width="1200" height="370" role="img" aria-labelledby="p2-t">
  <title id="p2-t">LLM Chatbot: Conversational AI with LangChain and Memory.</title>
  <defs>
    <linearGradient id="p2-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#190B12"/><stop offset="1" stop-color="#10070C"/>
    </linearGradient>
    <radialGradient id="p2-glow" cx="82%" cy="30%" r="55%">
      <stop offset="0" stop-color="#701A3D" stop-opacity=".7"/><stop offset="1" stop-color="#451126" stop-opacity="0"/>
    </radialGradient>
    <pattern id="p2-grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#C77B9B" stroke-opacity=".07"/>
    </pattern>
    <clipPath id="p2-clip"><rect width="1200" height="370" rx="18"/></clipPath>
    <linearGradient id="p2-trace" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8F0F3"/><stop offset=".45" stop-color="#E5B5C7"/><stop offset="1" stop-color="#C77B9B" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .p2-serif { font-family: Georgia, "Iowan Old Style", "Palatino Linotype", "Times New Roman", serif; }
    .p2-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .p2-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .p2-in { animation: p2-in 1.2s cubic-bezier(.16,1,.3,1) both; }
    .p2-d1 { animation-delay: .15s; } .p2-d2 { animation-delay: .4s; }
    .p2-chip { animation: p2-chip .7s cubic-bezier(.34,1.56,.64,1) both; }
    @keyframes p2-chip { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    .p2-draw { stroke-dasharray: 600; stroke-dashoffset: 600; animation: p2-draw 2s cubic-bezier(.65,0,.35,1) .5s forwards; }
    @keyframes p2-in { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
    @keyframes p2-draw { to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) { .p2-in, .p2-chip { animation: none; } .p2-draw { animation: none; stroke-dashoffset: 0; } }
    .p2-trace { stroke-dasharray: 564 3136; stroke-dashoffset: 3700; animation: p2-trace 7s linear infinite; }
    @keyframes p2-trace { to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) { .p2-trace { display: none; } }
  </style>
  <g clip-path="url(#p2-clip)">
    <rect width="1200" height="370" fill="url(#p2-bg)"/>
    <rect x="720" width="480" height="370" fill="url(#p2-grid)"/>
    <rect width="1200" height="370" fill="url(#p2-glow)"/>
    <rect class="p2-trace" x=".5" y=".5" width="1199" height="369" rx="17.5" fill="none" stroke="url(#p2-trace)" stroke-width="1.8"/>

    <g class="p2-in p2-d1">
      <text class="p2-mono" x="56" y="62" font-size="12" letter-spacing="2.6" fill="#C77B9B">02 &#183; LLM PIPELINES &#183; GENERATIVE AI &#183; 2026</text>
      <text class="p2-serif" x="54" y="126" font-size="48" font-weight="300" letter-spacing="-1.5" fill="#F8F0F3">LLM Chatbot</text>
      <text class="p2-sans" x="56" y="166" font-size="16.5" fill="#B6A3AC">Conversational assistant engineered on modern LLMs with structured prompt chains.</text>
      <text class="p2-mono" x="56" y="200" font-size="12.5" fill="#E5B5C7"><tspan fill="#C77B9B">ARCHITECTURE &#8594;</tspan> LangChain prompt engineering + context memory buffer + API integration</text>
      <line class="p2-draw" x1="56" y1="226" x2="680" y2="226" stroke="#C77B9B" stroke-opacity=".3"/>

      <g transform="translate(56 266)">
        <text class="p2-serif" font-size="34" font-weight="300" fill="#F8F0F3">Multi-Turn</text>
        <text class="p2-sans" y="24" font-size="12.5" fill="#B6A3AC">conversational memory</text>
      </g>
      <g transform="translate(260 266)">
        <text class="p2-serif" font-size="34" font-weight="300" fill="#F8F0F3">Zero-Shot</text>
        <text class="p2-sans" y="24" font-size="12.5" fill="#B6A3AC">&amp; few-shot prompt chains</text>
      </g>
      <g transform="translate(470 266)">
        <text class="p2-serif" font-size="34" font-weight="300" fill="#F8F0F3">Dynamic</text>
        <text class="p2-sans" y="24" font-size="12.5" fill="#B6A3AC">context augmentation</text>
      </g>

      <g class="p2-chip" style="animation-delay:1.00s"><rect x="56" y="314" width="70" height="26" rx="13" fill="#27101C" stroke="#C77B9B" stroke-opacity=".35"/><text class="p2-mono" x="91" y="331" text-anchor="middle" font-size="11.5" fill="#E5B5C7">Python</text></g>
      <g class="p2-chip" style="animation-delay:1.12s"><rect x="134" y="314" width="95" height="26" rx="13" fill="#27101C" stroke="#C77B9B" stroke-opacity=".35"/><text class="p2-mono" x="181" y="331" text-anchor="middle" font-size="11.5" fill="#E5B5C7">LangChain</text></g>
      <g class="p2-chip" style="animation-delay:1.24s"><rect x="237" y="314" width="60" height="26" rx="13" fill="#27101C" stroke="#C77B9B" stroke-opacity=".35"/><text class="p2-mono" x="267" y="331" text-anchor="middle" font-size="11.5" fill="#E5B5C7">LLMs</text></g>
      <g class="p2-chip" style="animation-delay:1.36s"><rect x="305" y="314" width="135" height="26" rx="13" fill="#27101C" stroke="#C77B9B" stroke-opacity=".35"/><text class="p2-mono" x="372" y="331" text-anchor="middle" font-size="11.5" fill="#E5B5C7">Prompt Engineering</text></g>
      <g class="p2-chip" style="animation-delay:1.48s"><rect x="448" y="314" width="85" height="26" rx="13" fill="#27101C" stroke="#C77B9B" stroke-opacity=".35"/><text class="p2-mono" x="490" y="331" text-anchor="middle" font-size="11.5" fill="#E5B5C7">REST API</text></g>
    </g>

    <!-- Visual Graphic: LLM Chain Flow Cards -->
    <g class="p2-in p2-d2" transform="translate(800 55)">
      <rect width="340" height="260" rx="14" fill="#140810" stroke="#C77B9B" stroke-opacity=".3"/>
      <path d="M0 14 a14 14 0 0 1 14 -14 H326 a14 14 0 0 1 14 14 V34 H0 Z" fill="#210D18"/>
      <circle cx="20" cy="17" r="4.5" fill="#701A3D"/><circle cx="35" cy="17" r="4.5" fill="#451126"/><circle cx="50" cy="17" r="4.5" fill="#451126"/>
      <text class="p2-mono" x="170" y="21" text-anchor="middle" font-size="10.5" letter-spacing="1.5" fill="#B6A3AC">LANGCHAIN REASONING LOOP</text>

      <!-- Message 1: User -->
      <g transform="translate(20 50)">
        <rect width="250" height="52" rx="10" fill="#27101C" stroke="#C77B9B" stroke-opacity=".35"/>
        <text class="p2-mono" x="14" y="22" font-size="11" fill="#E5B5C7">USER PROMPT</text>
        <text class="p2-sans" x="14" y="40" font-size="12" fill="#F8F0F3">"Synthesize key insights with context"</text>
      </g>

      <!-- Connecting signal pipe -->
      <path d="M145 102 V128" stroke="#E5B5C7" stroke-width="1.5" stroke-dasharray="4 4">
        <animate attributeName="stroke-dashoffset" values="0;8" dur="1s" repeatCount="indefinite"/>
      </path>

      <!-- Memory / Chain node -->
      <g transform="translate(45 128)">
        <rect width="250" height="42" rx="8" fill="#1F0B18" stroke="#701A3D" stroke-width="1.4"/>
        <circle cx="20" cy="21" r="5" fill="#E5B5C7">
          <animate attributeName="opacity" values="1;.4;1" dur="2s" repeatCount="indefinite"/>
        </circle>
        <text class="p2-mono" x="35" y="25" font-size="11" fill="#F8F0F3">LangChain Memory Buffer + Tools</text>
      </g>

      <path d="M145 170 V196" stroke="#E5B5C7" stroke-width="1.5" stroke-dasharray="4 4">
        <animate attributeName="stroke-dashoffset" values="0;8" dur="1s" repeatCount="indefinite"/>
      </path>

      <!-- Message 2: Model Assistant -->
      <g transform="translate(70 196)">
        <rect width="250" height="52" rx="10" fill="#331425" stroke="#E5B5C7" stroke-opacity=".5"/>
        <text class="p2-mono" x="14" y="22" font-size="11" fill="#C77B9B">ASSISTANT RESPONSE</text>
        <text class="p2-sans" x="14" y="40" font-size="12" fill="#F8F0F3">"Structured response delivered with facts."</text>
      </g>
    </g>
  </g>
</svg>