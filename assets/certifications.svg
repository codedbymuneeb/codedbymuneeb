<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#241019"/><stop offset="1" stop-color="#190B12"/></linearGradient>
  <linearGradient id="ac" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#701A3D"/><stop offset="1" stop-color="#C77B9B"/></linearGradient>
  <radialGradient id="gl"><stop offset="0" stop-color="#701A3D" stop-opacity=".4"/><stop offset="1" stop-color="#701A3D" stop-opacity="0"/></radialGradient>
</defs>
<rect width="1200" height="320" rx="18" fill="url(#bg)"/>
<circle cx="1100" cy="80" r="150" fill="url(#gl)"><animate attributeName="r" values="150;190;150" dur="7s" repeatCount="indefinite"/></circle>

<!-- Cert 1 -->
<g opacity="0"><animate attributeName="opacity" from="0" to="1" dur=".8s" begin="0.2s" fill="freeze"/>
  <rect x="60" y="30" width="340" height="120" rx="18" fill="#451126" fill-opacity=".7" stroke="#701A3D" stroke-width="1.5"/>
  <text x="80" y="68" font-family="Georgia,serif" font-size="16" fill="#E5B5C7" font-style="italic">AI Agents &amp; Agentic AI</text>
  <text x="80" y="90" font-family="'Segoe UI',sans-serif" font-size="13" fill="#B6A3AC">with Python and Generative AI</text>
  <text x="80" y="114" font-family="'Segoe UI',sans-serif" font-size="12" fill="#C77B9B">Vanderbilt University · Coursera · Aug 2026</text>
</g>

<!-- Cert 2 -->
<g opacity="0"><animate attributeName="opacity" from="0" to="1" dur=".8s" begin="0.5s" fill="freeze"/>
  <rect x="420" y="30" width="340" height="120" rx="18" fill="#451126" fill-opacity=".7" stroke="#701A3D" stroke-width="1.5"/>
  <text x="440" y="68" font-family="Georgia,serif" font-size="16" fill="#E5B5C7" font-style="italic">Python for Data Science, AI &amp; Dev</text>
  <text x="440" y="90" font-family="'Segoe UI',sans-serif" font-size="13" fill="#B6A3AC">IBM Professional Certificate</text>
  <text x="440" y="114" font-family="'Segoe UI',sans-serif" font-size="12" fill="#C77B9B">IBM · Coursera · Aug 2026</text>
</g>

<!-- Cert 3 -->
<g opacity="0"><animate attributeName="opacity" from="0" to="1" dur=".8s" begin="0.8s" fill="freeze"/>
  <rect x="780" y="30" width="360" height="120" rx="18" fill="#451126" fill-opacity=".7" stroke="#701A3D" stroke-width="1.5"/>
  <text x="800" y="62" font-family="Georgia,serif" font-size="15" fill="#E5B5C7" font-style="italic">Autonomous AI Trading Agents</text>
  <text x="800" y="84" font-family="'Segoe UI',sans-serif" font-size="13" fill="#B6A3AC">with n8n, MT5 and Free APIs</text>
  <text x="800" y="108" font-family="'Segoe UI',sans-serif" font-size="12" fill="#C77B9B">Packt · Coursera · Sep 2026</text>
</g>

<!-- Bottom note -->
<text x="600" y="210" text-anchor="middle" font-family="'Segoe UI',sans-serif" font-size="14" fill="#B6A3AC" opacity="0">All certificates verified on Coursera.<animate attributeName="opacity" from="0" to="1" dur=".8s" begin="1.2s" fill="freeze"/></text>
<text x="600" y="234" text-anchor="middle" font-family="Georgia,serif" font-size="13" font-style="italic" fill="#701A3D" opacity="0">Continuing to learn · More certifications in progress.<animate attributeName="opacity" from="0" to="1" dur=".8s" begin="1.5s" fill="freeze"/></text>
</svg>