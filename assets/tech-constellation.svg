<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#241019"/><stop offset="1" stop-color="#190B12"/></linearGradient>
  <linearGradient id="ac" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#701A3D"/><stop offset="1" stop-color="#C77B9B"/></linearGradient>
  <radialGradient id="gl"><stop offset="0" stop-color="#701A3D" stop-opacity=".4"/><stop offset="1" stop-color="#701A3D" stop-opacity="0"/></radialGradient>
</defs>
<rect width="1200" height="420" rx="18" fill="url(#bg)"/>
<circle cx="600" cy="210" r="300" fill="url(#gl)"><animate attributeName="r" values="300;340;300" dur="8s" repeatCount="indefinite"/><animate attributeName="opacity" values=".4;.7;.4" dur="8s" repeatCount="indefinite"/></circle>

