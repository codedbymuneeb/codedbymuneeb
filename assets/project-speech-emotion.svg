<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="220" viewBox="0 0 1200 220">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#241019"/><stop offset="1" stop-color="#190B12"/></linearGradient>
  <linearGradient id="ac" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#701A3D"/><stop offset="1" stop-color="#C77B9B"/></linearGradient>
  <radialGradient id="gl"><stop offset="0" stop-color="#701A3D" stop-opacity=".4"/><stop offset="1" stop-color="#701A3D" stop-opacity="0"/></radialGradient>
</defs>
<rect width="1200" height="220" rx="18" fill="url(#bg)"/>
<circle cx="1100" cy="30" r="130" fill="url(#gl)"><animate attributeName="r" values="130;170;130" dur="7s" repeatCount="indefinite"/></circle>

<!-- Top label -->
<rect x="60" y="28" width="180" height="28" rx="14" fill="#451126" stroke="#701A3D" stroke-width="1"/>
<text x="150" y="47" text-anchor="middle" font-family="'Segoe UI',sans-serif" font-size="12" letter-spacing="2" fill="#C77B9B">DEEP LEARNING · AUDIO ML</text>

<!-- Title -->
<text x="60" y="96" font-family="Georgia,'Times New Roman',serif" font-size="36" fill="#F8F0F3">Speech Emotion Recognition</text>
<rect x="60" y="106" width="380" height="3" rx="1.5" fill="url(#ac)"/>

<!-- Description -->
<text x="60" y="140" font-family="'Segoe UI',Arial,sans-serif" font-size="15" fill="#B6A3AC">Detects emotion from a speaker's voice using audio features and a trained</text>
<text x="60" y="162" font-family="'Segoe UI',Arial,sans-serif" font-size="15" fill="#B6A3AC">deep learning model. Built with Python, Librosa, TensorFlow/Keras.</text>

<!-- Tech pills -->
<rect x="60" y="182" width="80" height="26" rx="13" fill="#451126" stroke="#701A3D"/>
<text x="100" y="200" text-anchor="middle" font-family="'Segoe UI',sans-serif" font-size="12" fill="#E5B5C7">Python</text>
<rect x="152" y="182" width="120" height="26" rx="13" fill="#451126" stroke="#701A3D"/>
<text x="212" y="200" text-anchor="middle" font-family="'Segoe UI',sans-serif" font-size="12" fill="#E5B5C7">Deep Learning</text>
<rect x="284" y="182" width="88" height="26" rx="13" fill="#451126" stroke="#701A3D"/>
<text x="328" y="200" text-anchor="middle" font-family="'Segoe UI',sans-serif" font-size="12" fill="#E5B5C7">Audio ML</text>
</svg>