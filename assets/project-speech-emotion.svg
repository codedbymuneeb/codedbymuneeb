<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 370" width="1200" height="370" role="img" aria-labelledby="p1-t">
  <title id="p1-t">Speech Emotion Recognition: Voice emotion classifier using deep learning.</title>
  <defs>
    <linearGradient id="p1-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#190B12"/><stop offset="1" stop-color="#10070C"/>
    </linearGradient>
    <radialGradient id="p1-glow" cx="82%" cy="30%" r="55%">
      <stop offset="0" stop-color="#701A3D" stop-opacity=".7"/><stop offset="1" stop-color="#451126" stop-opacity="0"/>
    </radialGradient>
    <pattern id="p1-grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#C77B9B" stroke-opacity=".07"/>
    </pattern>
    <filter id="p1-glowf" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="p1-clip"><rect width="1200" height="370" rx="18"/></clipPath>
    <linearGradient id="p1-trace" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8F0F3"/><stop offset=".45" stop-color="#E5B5C7"/><stop offset="1" stop-color="#C77B9B" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .p1-serif { font-family: Georgia, "Iowan Old Style", "Palatino Linotype", "Times New Roman", serif; }
    .p1-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .p1-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .p1-in { animation: p1-in 1.2s cubic-bezier(.16,1,.3,1) both; }
    .p1-d1 { animation-delay: .15s; } .p1-d2 { animation-delay: .4s; }
    .p1-chip { animation: p1-chip .7s cubic-bezier(.34,1.56,.64,1) both; }
    @keyframes p1-chip { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    .p1-draw { stroke-dasharray: 600; stroke-dashoffset: 600; animation: p1-draw 2s cubic-bezier(.65,0,.35,1) .5s forwards; }
    @keyframes p1-in { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
    @keyframes p1-draw { to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) { .p1-in, .p1-chip { animation: none; } .p1-draw { animation: none; stroke-dashoffset: 0; } }
    .p1-trace { stroke-dasharray: 564 3136; stroke-dashoffset: 3700; animation: p1-trace 7s linear infinite; }
    @keyframes p1-trace { to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) { .p1-trace { display: none; } }
  </style>
  <g clip-path="url(#p1-clip)">
    <rect width="1200" height="370" fill="url(#p1-bg)"/>
    <rect x="720" width="480" height="370" fill="url(#p1-grid)"/>
    <rect width="1200" height="370" fill="url(#p1-glow)"/>
    <rect class="p1-trace" x=".5" y=".5" width="1199" height="369" rx="17.5" fill="none" stroke="url(#p1-trace)" stroke-width="1.8"/>

    <g class="p1-in p1-d1">
      <text class="p1-mono" x="56" y="62" font-size="12" letter-spacing="2.6" fill="#C77B9B">01 &#183; AUDIO ML &#183; DEEP LEARNING &#183; 2026</text>
      <text class="p1-serif" x="54" y="126" font-size="48" font-weight="300" letter-spacing="-1.5" fill="#F8F0F3">Speech Emotion Recognition</text>
      <text class="p1-sans" x="56" y="166" font-size="16.5" fill="#B6A3AC">Detects emotion from a speaker's voice using audio features and a deep neural network.</text>
      <text class="p1-mono" x="56" y="200" font-size="12.5" fill="#E5B5C7"><tspan fill="#C77B9B">ARCHITECTURE &#8594;</tspan> MFCC feature extraction + Mel-Spectrograms + Deep Audio Classifier</text>
      <line class="p1-draw" x1="56" y1="226" x2="680" y2="226" stroke="#C77B9B" stroke-opacity=".3"/>
      
      <g transform="translate(56 266)">
        <text class="p1-serif" font-size="34" font-weight="300" fill="#F8F0F3">8</text>
        <text class="p1-sans" y="24" font-size="12.5" fill="#B6A3AC">distinct emotion classes</text>
      </g>
      <g transform="translate(250 266)">
        <text class="p1-serif" font-size="34" font-weight="300" fill="#F8F0F3">MFCC</text>
        <text class="p1-sans" y="24" font-size="12.5" fill="#B6A3AC">acoustic feature extraction</text>
      </g>
      <g transform="translate(460 266)">
        <text class="p1-serif" font-size="34" font-weight="300" fill="#F8F0F3">Real-Time</text>
        <text class="p1-sans" y="24" font-size="12.5" fill="#B6A3AC">voice inference pipeline</text>
      </g>

      <g class="p1-chip" style="animation-delay:1.00s"><rect x="56" y="314" width="70" height="26" rx="13" fill="#27101C" stroke="#C77B9B" stroke-opacity=".35"/><text class="p1-mono" x="91" y="331" text-anchor="middle" font-size="11.5" fill="#E5B5C7">Python</text></g>
      <g class="p1-chip" style="animation-delay:1.12s"><rect x="134" y="314" width="105" height="26" rx="13" fill="#27101C" stroke="#C77B9B" stroke-opacity=".35"/><text class="p1-mono" x="186" y="331" text-anchor="middle" font-size="11.5" fill="#E5B5C7">Deep Learning</text></g>
      <g class="p1-chip" style="animation-delay:1.24s"><rect x="247" y="314" width="75" height="26" rx="13" fill="#27101C" stroke="#C77B9B" stroke-opacity=".35"/><text class="p1-mono" x="284" y="331" text-anchor="middle" font-size="11.5" fill="#E5B5C7">Librosa</text></g>
      <g class="p1-chip" style="animation-delay:1.36s"><rect x="330" y="314" width="85" height="26" rx="13" fill="#27101C" stroke="#C77B9B" stroke-opacity=".35"/><text class="p1-mono" x="372" y="331" text-anchor="middle" font-size="11.5" fill="#E5B5C7">Audio ML</text></g>
      <g class="p1-chip" style="animation-delay:1.48s"><rect x="423" y="314" width="95" height="26" rx="13" fill="#27101C" stroke="#C77B9B" stroke-opacity=".35"/><text class="p1-mono" x="470" y="331" text-anchor="middle" font-size="11.5" fill="#E5B5C7">NumPy/SciPy</text></g>
    </g>

    <!-- Visual Graphic: Audio Spectrogram & Emotion Radar -->
    <g class="p1-in p1-d2" transform="translate(800 65)">
      <rect width="340" height="240" rx="14" fill="#140810" stroke="#C77B9B" stroke-opacity=".3"/>
      <path d="M0 14 a14 14 0 0 1 14 -14 H326 a14 14 0 0 1 14 14 V34 H0 Z" fill="#210D18"/>
      <circle cx="20" cy="17" r="4.5" fill="#701A3D"/><circle cx="35" cy="17" r="4.5" fill="#451126"/><circle cx="50" cy="17" r="4.5" fill="#451126"/>
      <text class="p1-mono" x="170" y="21" text-anchor="middle" font-size="10.5" letter-spacing="1.5" fill="#B6A3AC">LIVE VOICE SPECTROGRAM</text>
      
      <!-- Animated Equalizer Waveform Bars -->
      <g transform="translate(30 160)">
        <rect x="0" y="-30" width="12" height="60" rx="3" fill="#C77B9B"><animate attributeName="height" values="20;70;30;60;20" dur="1.8s" repeatCount="indefinite"/><animate attributeName="y" values="-10;-35;-15;-30;-10" dur="1.8s" repeatCount="indefinite"/></rect>
        <rect x="18" y="-45" width="12" height="90" rx="3" fill="#E5B5C7"><animate attributeName="height" values="50;100;40;80;50" dur="1.4s" repeatCount="indefinite"/><animate attributeName="y" values="-25;-50;-20;-40;-25" dur="1.4s" repeatCount="indefinite"/></rect>
        <rect x="36" y="-60" width="12" height="120" rx="3" fill="#F8F0F3"><animate attributeName="height" values="80;120;60;110;80" dur="1.6s" repeatCount="indefinite"/><animate attributeName="y" values="-40;-60;-30;-55;-40" dur="1.6s" repeatCount="indefinite"/></rect>
        <rect x="54" y="-35" width="12" height="70" rx="3" fill="#E5B5C7"><animate attributeName="height" values="40;85;30;70;40" dur="1.5s" repeatCount="indefinite"/><animate attributeName="y" values="-20;-42;-15;-35;-20" dur="1.5s" repeatCount="indefinite"/></rect>
        <rect x="72" y="-50" width="12" height="100" rx="3" fill="#C77B9B"><animate attributeName="height" values="60;105;50;90;60" dur="1.9s" repeatCount="indefinite"/><animate attributeName="y" values="-30;-52;-25;-45;-30" dur="1.9s" repeatCount="indefinite"/></rect>
        <rect x="90" y="-25" width="12" height="50" rx="3" fill="#701A3D"><animate attributeName="height" values="25;60;20;50;25" dur="1.3s" repeatCount="indefinite"/><animate attributeName="y" values="-12;-30;-10;-25;-12" dur="1.3s" repeatCount="indefinite"/></rect>
        <rect x="108" y="-40" width="12" height="80" rx="3" fill="#E5B5C7"><animate attributeName="height" values="45;90;35;75;45" dur="1.7s" repeatCount="indefinite"/><animate attributeName="y" values="-22;-45;-17;-37;-22" dur="1.7s" repeatCount="indefinite"/></rect>
        <rect x="126" y="-55" width="12" height="110" rx="3" fill="#F8F0F3"><animate attributeName="height" values="70;115;55;100;70" dur="1.5s" repeatCount="indefinite"/><animate attributeName="y" values="-35;-57;-27;-50;-35" dur="1.5s" repeatCount="indefinite"/></rect>
        <rect x="144" y="-30" width="12" height="60" rx="3" fill="#C77B9B"><animate attributeName="height" values="30;70;25;65;30" dur="1.8s" repeatCount="indefinite"/><animate attributeName="y" values="-15;-35;-12;-32;-15" dur="1.8s" repeatCount="indefinite"/></rect>
        <rect x="162" y="-45" width="12" height="90" rx="3" fill="#701A3D"><animate attributeName="height" values="50;95;40;80;50" dur="1.6s" repeatCount="indefinite"/><animate attributeName="y" values="-25;-47;-20;-40;-25" dur="1.6s" repeatCount="indefinite"/></rect>
        <rect x="180" y="-20" width="12" height="40" rx="3" fill="#451126"><animate attributeName="height" values="15;50;15;40;15" dur="1.4s" repeatCount="indefinite"/><animate attributeName="y" values="-7;-25;-7;-20;-7" dur="1.4s" repeatCount="indefinite"/></rect>
        <rect x="198" y="-35" width="12" height="70" rx="3" fill="#C77B9B"><animate attributeName="height" values="35;80;30;65;35" dur="1.7s" repeatCount="indefinite"/><animate attributeName="y" values="-17;-40;-15;-32;-17" dur="1.7s" repeatCount="indefinite"/></rect>
        <rect x="216" y="-50" width="12" height="100" rx="3" fill="#E5B5C7"><animate attributeName="height" values="60;100;45;85;60" dur="1.5s" repeatCount="indefinite"/><animate attributeName="y" values="-30;-50;-22;-42;-30" dur="1.5s" repeatCount="indefinite"/></rect>
        <rect x="234" y="-25" width="12" height="50" rx="3" fill="#701A3D"><animate attributeName="height" values="20;55;20;45;20" dur="1.9s" repeatCount="indefinite"/><animate attributeName="y" values="-10;-27;-10;-22;-10" dur="1.9s" repeatCount="indefinite"/></rect>
        <rect x="252" y="-40" width="12" height="80" rx="3" fill="#C77B9B"><animate attributeName="height" values="40;85;30;70;40" dur="1.4s" repeatCount="indefinite"/><animate attributeName="y" values="-20;-42;-15;-35;-20" dur="1.4s" repeatCount="indefinite"/></rect>
      </g>

      <!-- Emotion Prediction Tag -->
      <g transform="translate(24 48)">
        <rect width="292" height="42" rx="8" fill="#1F0B18" stroke="#E5B5C7" stroke-opacity=".4"/>
        <circle cx="20" cy="21" r="5" fill="#E5B5C7">
          <animate attributeName="opacity" values="1;.3;1" dur="1.5s" repeatCount="indefinite"/>
        </circle>
        <text class="p1-mono" x="36" y="25" font-size="11.5" fill="#F8F0F3">DETECTED: <tspan fill="#E5B5C7" font-weight="bold">CONFIDENT / CALM</tspan> (94%)</text>
      </g>
    </g>
  </g>
</svg>