<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 370" width="1200" height="370" role="img" aria-labelledby="p3-t">
  <title id="p3-t">Computer Vision: Image and video processing with OpenCV.</title>
  <defs>
    <linearGradient id="p3-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#190B12"/><stop offset="1" stop-color="#10070C"/>
    </linearGradient>
    <radialGradient id="p3-glow" cx="82%" cy="30%" r="55%">
      <stop offset="0" stop-color="#701A3D" stop-opacity=".7"/><stop offset="1" stop-color="#451126" stop-opacity="0"/>
    </radialGradient>
    <pattern id="p3-grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#C77B9B" stroke-opacity=".07"/>
    </pattern>
    <clipPath id="p3-clip"><rect width="1200" height="370" rx="18"/></clipPath>
    <linearGradient id="p3-trace" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8F0F3"/><stop offset=".45" stop-color="#E5B5C7"/><stop offset="1" stop-color="#C77B9B" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .p3-serif { font-family: Georgia, "Iowan Old Style", "Palatino Linotype", "Times New Roman", serif; }
    .p3-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .p3-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .p3-in { animation: p3-in 1.2s cubic-bezier(.16,1,.3,1) both; }
    .p3-d1 { animation-delay: .15s; } .p3-d2 { animation-delay: .4s; }
    .p3-chip { animation: p3-chip .7s cubic-bezier(.34,1.56,.64,1) both; }
    @keyframes p3-chip { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    .p3-draw { stroke-dasharray: 600; stroke-dashoffset: 600; animation: p3-draw 2s cubic-bezier(.65,0,.35,1) .5s forwards; }
    @keyframes p3-in { from { opacity: 0; } to { opacity: 1; } }
    @keyframes p3-draw { to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) { .p3-in, .p3-chip { animation: none; } .p3-draw { animation: none; stroke-dashoffset: 0; } }
    .p3-trace { stroke-dasharray: 564 3136; stroke-dashoffset: 3700; animation: p3-trace 7s linear infinite; }
    @keyframes p3-trace { to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) { .p3-trace { display: none; } }
  </style>
  <g clip-path="url(#p3-clip)">
    <rect width="1200" height="370" fill="url(#p3-bg)"/>
    <rect x="720" width="480" height="370" fill="url(#p3-grid)"/>
    <rect width="1200" height="370" fill="url(#p3-glow)"/>
    <rect class="p3-trace" x=".5" y=".5" width="1199" height="369" rx="17.5" fill="none" stroke="url(#p3-trace)" stroke-width="1.8"/>

    <g class="p3-in p3-d1">
      <text class="p3-mono" x="56" y="62" font-size="12" letter-spacing="2.6" fill="#C77B9B">03 &#183; COMPUTER VISION &#183; REAL-TIME AI &#183; 2026</text>
      <text class="p3-serif" x="54" y="126" font-size="48" font-weight="300" letter-spacing="-1.5" fill="#F8F0F3">Computer Vision</text>
      <text class="p3-sans" x="56" y="166" font-size="16.5" fill="#B6A3AC">Image and video processing, feature detection, and object tracking pipelines.</text>
      <text class="p3-mono" x="56" y="200" font-size="12.5" fill="#E5B5C7"><tspan fill="#C77B9B">PIPELINE &#8594;</tspan> OpenCV edge filtering + contour tracking + morphological transforms</text>
      <line class="p3-draw" x1="56" y1="226" x2="680" y2="226" stroke="#C77B9B" stroke-opacity=".3"/>

      <g transform="translate(56 266)">
        <text class="p3-serif" font-size="34" font-weight="300" fill="#F8F0F3">Real-Time</text>
        <text class="p3-sans" y="24" font-size="12.5" fill="#B6A3AC">video stream analysis</text>
      </g>
      <g transform="translate(250 266)">
        <text class="p3-serif" font-size="34" font-weight="300" fill="#F8F0F3">Contours</text>
        <text class="p3-sans" y="24" font-size="12.5" fill="#B6A3AC">&amp; boundary extraction</text>
      </g>
      <g transform="translate(460 266)">
        <text class="p3-serif" font-size="34" font-weight="300" fill="#F8F0F3">Spatial</text>
        <text class="p3-sans" y="24" font-size="12.5" fill="#B6A3AC">filtering &amp; color masks</text>
      </g>

      <g class="p3-chip" style="animation-delay:1.00s"><rect x="56" y="314" width="70" height="26" rx="13" fill="#27101C" stroke="#C77B9B" stroke-opacity=".35"/><text class="p3-mono" x="91" y="331" text-anchor="middle" font-size="11.5" fill="#E5B5C7">Python</text></g>
      <g class="p3-chip" style="animation-delay:1.12s"><rect x="134" y="314" width="75" height="26" rx="13" fill="#27101C" stroke="#C77B9B" stroke-opacity=".35"/><text class="p3-mono" x="171" y="331" text-anchor="middle" font-size="11.5" fill="#E5B5C7">OpenCV</text></g>
      <g class="p3-chip" style="animation-delay:1.24s"><rect x="217" y="314" width="65" height="26" rx="13" fill="#27101C" stroke="#C77B9B" stroke-opacity=".35"/><text class="p3-mono" x="249" y="331" text-anchor="middle" font-size="11.5" fill="#E5B5C7">NumPy</text></g>
      <g class="p3-chip" style="animation-delay:1.36s"><rect x="290" y="314" width="130" height="26" rx="13" fill="#27101C" stroke="#C77B9B" stroke-opacity=".35"/><text class="p3-mono" x="355" y="331" text-anchor="middle" font-size="11.5" fill="#E5B5C7">Feature Detection</text></g>
      <g class="p3-chip" style="animation-delay:1.48s"><rect x="428" y="314" width="120" height="26" rx="13" fill="#27101C" stroke="#C77B9B" stroke-opacity=".35"/><text class="p3-mono" x="488" y="331" text-anchor="middle" font-size="11.5" fill="#E5B5C7">Video Processing</text></g>
    </g>

    <!-- Visual Graphic: OpenCV Vision Tracking Reticle -->
    <g transform="translate(800 65)">
      <g class="p3-in p3-d2">
        <rect width="340" height="240" rx="14" fill="#140810" stroke="#C77B9B" stroke-opacity=".3"/>
        <path d="M0 14 a14 14 0 0 1 14 -14 H326 a14 14 0 0 1 14 14 V34 H0 Z" fill="#210D18"/>
        <circle cx="20" cy="17" r="4.5" fill="#701A3D"/><circle cx="35" cy="17" r="4.5" fill="#451126"/><circle cx="50" cy="17" r="4.5" fill="#451126"/>
        <text class="p3-mono" x="170" y="21" text-anchor="middle" font-size="10.5" letter-spacing="1.5" fill="#B6A3AC">OPENCV REAL-TIME FRAME</text>

        <!-- Viewport Frame & Crosshairs -->
        <g transform="translate(30 48)">
          <rect width="280" height="170" rx="8" fill="#1C0A15" stroke="#701A3D" stroke-opacity=".6"/>
          
          <!-- Target Bounding Box with animated scan line -->
          <g transform="translate(45 25)">
            <rect width="190" height="120" rx="6" fill="none" stroke="#E5B5C7" stroke-width="1.8" stroke-dasharray="6 4"/>
            <!-- Reticle corners -->
            <path d="M-6 8 V-6 H8" fill="none" stroke="#F8F0F3" stroke-width="2.5"/>
            <path d="M196 8 V-6 H182" fill="none" stroke="#F8F0F3" stroke-width="2.5"/>
            <path d="M-6 112 V126 H8" fill="none" stroke="#F8F0F3" stroke-width="2.5"/>
            <path d="M196 112 V126 H182" fill="none" stroke="#F8F0F3" stroke-width="2.5"/>

            <!-- Laser Scan Line -->
            <line x1="0" y1="0" x2="190" y2="0" stroke="#E5B5C7" stroke-width="2">
              <animate attributeName="y1" values="5;115;5" dur="3s" repeatCount="indefinite"/>
              <animate attributeName="y2" values="5;115;5" dur="3s" repeatCount="indefinite"/>
              <animate attributeName="opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite"/>
            </line>

            <rect x="0" y="-18" width="100" height="16" fill="#701A3D" rx="3"/>
            <text class="p3-mono" x="6" y="-6" font-size="9.5" fill="#F8F0F3">TARGET [98.4%]</text>

            <!-- Tracking points -->
            <circle cx="50" cy="45" r="4" fill="#E5B5C7"><animate attributeName="r" values="3;6;3" dur="2s" repeatCount="indefinite"/></circle>
            <circle cx="140" cy="70" r="4" fill="#C77B9B"><animate attributeName="r" values="3;6;3" dur="2.4s" repeatCount="indefinite"/></circle>
          </g>
        </g>
      </g>
    </g>
  </g>
</svg>